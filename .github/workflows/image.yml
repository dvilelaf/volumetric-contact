# Builds docker/Dockerfile and publishes it to GHCR, so that anyone can run the battery without
# building the toolchain (scripts/dev.sh pulls it). Runs on a published release or by hand.
name: image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dvilelaf/volumetric-contact-dev
  TOOLCHAIN_TAG: drake-1.58.0-chrono-10.0.0-mujoco-4.0.0

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          tags="$IMAGE:$TOOLCHAIN_TAG"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then tags+=$'\n'"$IMAGE:${GITHUB_REF_NAME}"; fi
          { echo 'list<<EOF'; echo "$tags"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.list }}
          labels: org.opencontainers.image.source=https://github.com/dvilelaf/volumetric-contact
          cache-from: type=gha
          cache-to: type=gha,mode=max
