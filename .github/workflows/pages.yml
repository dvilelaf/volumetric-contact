# Publishes the paper PDF, the landing page and the viewer with the slim trajectories to GitHub
# Pages on every push to the default branch. Settings -> Pages -> Source: GitHub Actions.
# Both steps run locally the same way: scripts/paper.sh and scripts/site.sh.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Paper (Tectonic, pinned by checksum in the script)
        run: scripts/paper.sh
      - name: Site
        run: scripts/site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
