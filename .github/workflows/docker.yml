# Manual: builds the full development image (Drake, Chrono, MuJoCo) and runs every check inside it.
# It needs far more disk and time than the regular CI; start it from the Actions tab before a release.
name: docker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: astral-sh/setup-uv@v5
      - name: Build the image
        run: scripts/dev.sh image
      - name: Verify
        run: scripts/verify full
